networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data: {}
  grafana-data: {}
  loki-data: {}
  alloy-data: {}

services:
  alpine:
    image: alpine:3.22
    container_name: alpine
    command: [ "tail", "-f", "/dev/null" ]
    networks:
      - monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    ports:
      - "${BIND_IP:-0.0.0.0}:${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
      - "--web.external-url=/prometheus/"
      - "--web.route-prefix=/prometheus/"
    restart: unless-stopped

  yace:
    image: prometheuscommunity/yet-another-cloudwatch-exporter
    container_name: yace
    ports:
      - "${BIND_IP:-0.0.0.0}:${YACE_PORT}:5000"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_DEFAULT_REGION: ${AWS_REGION}
    volumes:
      - ./yace/config.yml:/etc/yace/config.yml:ro
    networks:
      - monitoring
    command:
      - "--config.file=/etc/yace/config.yml"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    container_name: loki

    ports:
      - "${BIND_IP:-0.0.0.0}:${LOKI_PORT}:3100"
    volumes:
      - ./loki/config.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki
    networks:
      - monitoring
    command:
      - "-config.file=/etc/loki/local-config.yml"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    ports:
      - "${BIND_IP:-0.0.0.0}:${NODE_EXPORTER_PORT}:9100"
    networks:
      - monitoring
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    privileged: true
    pid: "host"
    ports:
      - "${BIND_IP:-0.0.0.0}:${CADVISOR_PORT}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    command:
      - "-docker_only=true"
      - "-housekeeping_interval=10s"
      - "-enable_metrics=cpu,memory,network,oom_event,process"

    networks:
      - monitoring
    restart: unless-stopped


  alloy:
    image: grafana/alloy:v1.6.1
    container_name: alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
    networks:
      - monitoring
    command:
      - "run"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    ports:
      - "${BIND_IP:-0.0.0.0}:${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki
      - yace
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-gateway
    ports:
      - "${BIND_IP:-0.0.0.0}:${NGINX_PORT:-80}:80"
    environment:
      - SERVER_NAME=${SERVER_NAME:-127.0.0.1}
      - NGINX_PORT=80
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
      - grafana
      - node-exporter
      - cadvisor
      - yace
      - loki
    restart: unless-stopped

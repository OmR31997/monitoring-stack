apiVersion: 1

providers:
  - name: 'Managed Monitoring Dashboards'
    orgId: 1
    folder: 'Managed Dashboards'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 5
    allowUiUpdates: true
    overwrite: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    metrics_path: "/prometheus/metrics"
    static_configs:
      - targets:
          - "prometheus:9090"
  - job_name: "yace"
    static_configs:
      - targets:
          - "yace:5000"
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"
  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"
